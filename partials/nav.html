<!--
  FONTE DA VERDADE da navegação do site.

  Este arquivo é o bloco canônico do header. Mora fora de docs/ de propósito:
  docs/ é o que o GitHub Pages serve, e um fragmento de HTML solto lá viraria
  uma página pública sem cabeça nem corpo.

  Ele é replicado dentro de cada página de docs/, entre os marcadores
  "nav:start" e "nav:end", por:

      python scripts/sync_nav.py

  Não edite o header dentro das páginas — a próxima sincronização desfaz.
  Edite aqui e rode o script.

  O placeholder de prefixo é substituído pelo caminho relativo da página
  ("", "../", "../../"), para os links funcionarem em qualquer profundidade
  e também com o site aberto via file://. O item da página atual recebe
  aria-current="page" automaticamente, a partir do data-nav correspondente.

  Máximo de 6 itens, por decisão de projeto (6 desde a vitrine de Indicadores). Reajuste está no menu por ser a
  propriedade principal (513 páginas permanentes); Correção monetária é
  alcançada de dentro do hub de Reajuste.

  O Radar saiu do menu: as páginas continuam em docs/radar/, mas nada no
  site leva até elas. Para religar, basta devolver a linha do item aqui e
  rodar scripts/sync_nav.py.
-->
