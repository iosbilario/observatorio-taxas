# ============================================================================
# monitor.yml — Motor do observatório (GitHub Actions).
#
# A cada 6 horas (e sob demanda via workflow_dispatch) consulta o SGS/BACEN,
# atualiza os snapshots em data/ e o CHANGELOG.md, e commita/empurra de volta
# SOMENTE quando algo mudou. Custo zero, idempotente.
# ============================================================================
name: monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (UTC)
  workflow_dispatch:         # execução manual pela aba Actions

permissions:
  contents: write            # necessário para o commit/push automático

# Evita execuções concorrentes pisando umas nas outras.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinado por SHA de commit (supply-chain). Tag: v6.0.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        # Pinado por SHA de commit (supply-chain). Tag: v6.3.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # Os secrets NÃO ficam no env do job: cada um só aparece no step que o
      # usa. O contexto `secrets` não é acessível em `if:` de step, então este
      # step curto (shell puro, sem código de terceiros) publica flags de
      # presença como outputs para os `if:` abaixo.
      - name: Detectar secrets opcionais
        id: opcionais
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          echo "has_anthropic=$([ -n "$ANTHROPIC_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_goatcounter=$([ -n "$GOATCOUNTER_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # requirements.txt é um lock (versões exatas + hashes, gerado de
      # requirements.in por pip-compile); --require-hashes falha se qualquer
      # artefato divergir do esperado — proteção de supply chain, já que este
      # job tem contents: write.
      - name: Instalar dependências
        run: pip install --require-hashes -r requirements.txt

      # Dependência opcional do resumo em linguagem natural (diff_summary.py).
      # Só instala se o secret ANTHROPIC_API_KEY estiver definido. Pinada por
      # versão exata (fora do lock por ser opcional).
      - name: Instalar dependência opcional (resumo NL)
        if: steps.opcionais.outputs.has_anthropic == 'true'
        run: pip install anthropic==1.2.0

      - name: Coletar séries do SGS/BACEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch.py

      - name: Gerar páginas programáticas de reajuste
        run: python scripts/build_pages.py

      - name: Gerar calculadora de correção monetária
        run: python scripts/build_correcao.py

      - name: Assar boletim no HTML da landing e regenerar o sitemap
        run: python scripts/render_index.py

      # Depois dos geradores: build_pages.py e build_correcao.py reescrevem
      # as páginas de reajuste e correção do zero a cada coleta, então o
      # header precisa ser reaplicado aqui, senão some.
      - name: Replicar o header de navegação em todas as páginas
        run: python scripts/sync_nav.py

      # Depois de tudo que reescreve index.html/embed.html: recalcula os
      # hashes sha256 dos scripts inline na CSP (sem 'unsafe-inline').
      - name: Atualizar hashes de CSP dos scripts inline
        run: python scripts/csp_hashes.py

      - name: Gerar card social (og-image) com os números do dia
        run: python scripts/build_og.py

      - name: Coletar estatísticas de acesso (GoatCounter)
        if: steps.opcionais.outputs.has_goatcounter == 'true'
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/fetch_stats.py

      - name: Commit + push se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nenhuma mudança — nada a commitar."
          else
            git commit -m "chore: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
