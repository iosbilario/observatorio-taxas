# ============================================================================
# validate.yml — Validação de pull requests (SEO, dados estruturados e
# regressão dos cálculos).
#
# Independente do monitor.yml: roda só em PR e sob demanda, com permissão de
# leitura, sem commit e sem push. Uma falha aqui bloqueia (se você exigir o
# check) apenas o merge do PR, nunca a coleta periódica de dados.
# ============================================================================
name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Pinado por SHA de commit (supply-chain). Tag: v6.0.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        # Pinado por SHA de commit (supply-chain); mesmo SHA do monitor.yml
        # (atualizado pelo Dependabot no PR #14, actions/setup-python 7.1.0).
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --require-hashes -r requirements.txt

      # 1) O que está commitado é o que o Pages vai publicar: testa primeiro.
      - name: Testes sobre o docs/ commitado
        run: python -m unittest discover -s tests -v

      # 2) Os geradores reproduzem o docs/ commitado? Pega PR que mudou um
      #    script sem regenerar as páginas (ou o contrário). docs/index.html
      #    fica de fora: o carimbo do boletim leva o hash do commit, que no PR
      #    é o merge ref.
      - name: Regenerar as páginas como o monitor.yml faz
        run: |
          python scripts/build_pages.py
          python scripts/build_correcao.py
          python scripts/render_index.py
          python scripts/sync_nav.py
          python scripts/adsense.py
          python scripts/csp_hashes.py

      - name: Conferir que a regeneração não mudou nada
        run: |
          if ! git diff --exit-code --stat -- . ':(exclude)docs/index.html'; then
            echo "::error::Os geradores produzem um docs/ diferente do commitado. Rode o pipeline e commite o resultado."
            exit 1
          fi

      - name: Testes sobre o docs/ regenerado
        run: python -m unittest discover -s tests -v
