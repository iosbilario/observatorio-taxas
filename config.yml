# config.yml — Séries do SGS/BACEN monitoradas pelo observatório.
#
# NOTA: os códigos abaixo devem ser VALIDADOS contra o SGS e podem ser
# ampliados livremente (basta adicionar novos itens em `series`).
# Referência das séries: https://www3.bcb.gov.br/sgspub/

fonte: "BACEN SGS"

# GoatCounter — coletor de métricas de acesso (grátis, sem servidor).
# Guarde APENAS o código do site (o subdomínio em <code>.goatcounter.com).
# A partir dele são montados, sem duplicação:
#   - o beacon <script> injetado nas páginas (build_pages.py / build_correcao.py);
#   - a URL da API de estatísticas (scripts/fetch_stats.py).
# Deixe "" para desativar a coleta e não injetar nenhum beacon.
goatcounter_code: "observatoriotaxas"

# Google AdSense. Fonte única do identificador; lido por scripts/adsense.py,
# que escreve docs/ads.txt e, só com `ativo: true`, insere o código de
# anúncio nos espaços marcados das páginas. Ver desenvolvimento/ADSENSE.md.
adsense:
  client: "ca-pub-4229313749435489"
  # Linha fornecida pelo AdSense (verificação de propriedade por ads.txt).
  ads_txt: "google.com, pub-4229313749435489, DIRECT, f08c47fec0942fa0"
  # Só ligue depois de: domínio aprovado no AdSense, mensagem de
  # consentimento (Privacidade e mensagens > CMP do Google) publicada e
  # unidades de anúncio criadas (ids em `slots`).
  ativo: false
  consentimento_configurado: false
  # nome do espaço -> data-ad-slot (número gerado pelo AdSense ao criar a
  # unidade). Espaços sem id ficam vazios. Nomes: inicio, reajuste-hub,
  # reajuste-mes, correcao-hub, correcao-indice.
  slots: {}

# IndexNow — avisa buscadores participantes (Bing, Yandex, Seznam, Naver...)
# quando uma URL é criada, alterada ou removida. A chave NÃO é segredo: o
# protocolo exige publicá-la em https://<host>/<chave>.txt (docs/<chave>.txt).
# Trocar a chave = gerar outra (8 a 128 caracteres [a-zA-Z0-9-]), renomear o
# arquivo e atualizar aqui. Deixe "" para desligar. Ver scripts/indexnow.py.
indexnow_key: "f38e6e174b4a83156de2bf6385271334"
indexnow_endpoint: "https://api.indexnow.org/indexnow"
# Base sem sufixo: o código monta /ultimos/N (coleta) ou ?dataInicial=&dataFinal=
# (backfill histórico). Ver scripts/fetch.py e scripts/backfill.py.
base_url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.{codigo}/dados"

# Quantos anos de histórico o backfill puxa (scripts/backfill.py).
anos_historico: 2

series:
  # --- Juros ---
  - codigo: 432
    nome: "Meta Selic (% a.a.)"
    grupo: "Juros"
  - codigo: 1178
    nome: "Selic anualizada (% a.a.)"
    grupo: "Juros"
  - codigo: 4390
    # No SGS, 4390 é "Taxa de juros - Selic acumulada no mês" (BCB/Demab).
    # O CDI acumulado no mês é a série 4391. Rótulo corrigido em 11/11/2026.
    nome: "Selic - acumulada no mês (%)"
    grupo: "Juros"
  - codigo: 226
    nome: "TR - Taxa Referencial (%)"
    grupo: "Juros"
  - codigo: 25
    # No SGS, 25 é a rentabilidade da poupança para depósitos até 03/05/2012
    # (regra antiga). Rótulo corrigido em 11/11/2026.
    nome: "Poupança (depósitos até 03/05/2012) - rentabilidade (%)"
    grupo: "Juros"
  # --- Inflação ---
  - codigo: 433
    nome: "IPCA - variação mensal (%)"
    grupo: "Inflação"
  - codigo: 13522
    nome: "IPCA - acumulado 12 meses (%)"
    grupo: "Inflação"
  - codigo: 188
    nome: "INPC - variação mensal (%)"
    grupo: "Inflação"
  - codigo: 189
    nome: "IGP-M - variação mensal (%)"
    grupo: "Inflação"
  - codigo: 190
    nome: "IGP-DI - variação mensal (%)"
    grupo: "Inflação"
  # --- Câmbio ---
  - codigo: 1
    nome: "Câmbio USD/BRL - venda"
    grupo: "Câmbio"
  - codigo: 10813
    nome: "Câmbio USD/BRL - compra"
    grupo: "Câmbio"
  - codigo: 21619
    nome: "Câmbio EUR/BRL - venda"
    grupo: "Câmbio"
  # --- Atividade & Emprego ---
  - codigo: 24363
    nome: "IBC-Br - índice (proxy do PIB)"
    grupo: "Atividade & Emprego"
  - codigo: 24369
    nome: "Taxa de desocupação - PNAD (%)"
    grupo: "Atividade & Emprego"
